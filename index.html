<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para o Melhor Pai ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Tela inicial -->
    <section id="inicio" class="tela-inicial">

        <div class="conteudo-inicial">

            <div class="coracao">❤️</div>

            <h1>Uma surpresa<br>para você, Pai</h1>

            <p>
                Preparei uma pequena homenagem
                especialmente para você.
            </p>

            <button id="btnComecar">
                Começar ❤️
            </button>

        </div>

    </section>


    <!-- Área principal da homenagem -->
    <main id="video" class="video-container">

        <!-- Foto -->
        <div class="foto-container">
            <img id="foto" src="" alt="Foto da homenagem">
        </div>

        <!-- Texto -->
        <div class="texto-container">

            <p id="texto"></p>

        </div>

        <!-- Indicadores -->
        <div id="indicadores" class="indicadores"></div>

    </main>


   <!-- Tela final -->
<section id="final" class="tela-final">
    <div class="particulas">
    <span>✦</span>
    <span>·</span>
    <span>✧</span>
    <span>·</span>
    <span>✦</span>
    <span>·</span>
    <span>✧</span>
    <span>·</span>
    <span>✦</span>
    <span>·</span>
</div>

    <div class="conteudo-final">

        <div class="coracao-grande">❤️</div>

        <p class="frase-final">
            Que Deus continue abençoando
            sua vida, seus caminhos
            e nossa família.
        </p>

        <h1>
            Feliz Dia dos Pais, Pai!
        </h1>

        <p class="amor-final">
            Nós te amamos muito. ❤️
        </p>

        <span>
            De nós três
        </span>

    </div>

</section>


    <!-- Música -->
  <audio id="musica" loop>
    <source src="assets/assets/musica.mp3" type="audio/mpeg">
</audio>


    <script src="script.js"></script>

</body>
</html>
